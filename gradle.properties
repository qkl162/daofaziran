# ===== FuLu - Forge 1.20.1 build config =====
# Change version numbers here, not in build.gradle.
# NOTE: .properties files are read as ISO-8859-1, so the description below is
# written with \uXXXX escapes instead of raw Chinese (comments stay ASCII for
# the same reason).
mod_id=fulu
mod_name=FuLu
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.lengyang.fulu
mod_authors=lengyang
mod_description=\u7b26\u7eb8 \u00b7 \u9ec4\u7eb8\u6731\u7802\uff0c\u753b\u7b26\u6210\u7b93\uff1a\u4fee\u4ed9\u5411\u5236\u7b26\u6a21\u7ec4\u7684\u7b2c\u4e00\u6b65\u3002

# --- platform ---
minecraft_version=1.20.1
forge_version=47.2.20

# --- local dev environment ---
# The JDK path is NOT written here: properties files are ISO-8859-1 and this
# machine's JDK lives under a CJK path. tools/build.ps1 reads tools/java-home.txt
# (plain UTF-8) instead.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true

# --- mappings ---
mapping_channel=official
mapping_version=1.20.1
